or(side,lane*4.15);mesh.position.y+=.38;mesh.rotation.y=Math.atan2(t.x,t.z);return{u,p,t,side}}function loop(now){const dt=Math.min(.033,(now-start)/1000);start=now;const speed=218+Math.sin(now*.0007)*24;distance+=speed/3.6*dt;const s=place(player,distance,0);updateProxyRuntime(player,undefined,{speedKph:speed,time:now/1000});ai.forEach((m,i)=>{const d=distance+22+i*17+Math.sin(now*.0004+i)*6;place(m,d,(i%3)-1);updateProxyRuntime(m,undefined,{speedKph:speed*(.91+i*.012),time:now/1000+i});});const back=11.2,height=4.2,target=s.p.clone().add(new THREE.Vector3(0,.95,0)),cam=target.clone().addScaledVector(s.t,-back).add(new THREE.Vector3(0,height,0)).addScaledVector(s.side,.4);camera.position.lerp(cam,.08);camera.lookAt(target.clone().addScaledVector(s.t,16));world.update({progress:s.u,playerPosition:s.p,playerTangent:s.t,speedKph:speed,dt,puddleDepth:.45});document.getElementById('speed').textContent=Math.round(speed);composer.render();requestAnimationFrame(loop)}document.getElementById('loading').classList.add('hide');requestAnimationFrame(loop);</script></body></html>
