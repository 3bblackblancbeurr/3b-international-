<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#030405;color:#f7f4ed}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#123451,#030405 75%)}main{width:min(700px,100%);padding:32px 18px;text-align:center}h1{font-size:clamp(1.8rem,6vw,3rem)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;min-height:130px;padding:16px 6px;border:1px solid #8ee8ff55;border-radius:18px;background:#081522;color:#fff;text-decoration:none;font:inherit;font-weight:800;cursor:pointer}.card:hover{border-color:#e6ca8e}.card:focus-visible{outline:3px solid #8ee8ff;outline-offset:3px}.card:disabled{opacity:.6}.symbol{font-size:2rem}#install-status{color:#cbd3dc;line-height:1.6}footer{margin-top:28px}footer a{color:#cfe9ff}@media(max-width:380px){.grid{gap:6px}.card{min-height:110px;font-size:.9rem}}
</style>
</head>
<body><main>
<h1>Installer 3B</h1>
<section class="grid" aria-label="Choisir son appareil">
<button class="card" type="button" data-install="pc"><span class="symbol" aria-hidden="true">▣</span>PC</button>
<button class="card" type="button" data-install="android"><span class="symbol" aria-hidden="true">▯</span>Android</button>

</section>
<p id="install-status" role="status"></p>
<noscript><p>PC : menu Chrome ou Edge → Installer. Android : menu Chrome → Installer l’application.</p></noscript>
<footer><a href="/">Ouvrir 3B</a></footer>
</main></body></html>
