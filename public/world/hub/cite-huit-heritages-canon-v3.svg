<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Cité des Huit Héritages — plan canonique 3B</title>
<desc id="desc">Métropole centrale du Monde du 3B avec dix quartiers utiles, huit Portes dispersées, eau, ponts, transports et Tour du Cercle Brisé.</desc>
<defs>
 <radialGradient id="bg" cx="50%" cy="48%" r="72%"><stop offset="0" stop-color="#12364b"/><stop offset=".46" stop-color="#07131d"/><stop offset="1" stop-color="#020508"/></radialGradient>
 <linearGradient id="road" x1="0" x2="1"><stop stop-color="#805f24"/><stop offset=".5" stop-color="#f0d185"/><stop offset="1" stop-color="#805f24"/></linearGradient>
 <linearGradient id="water" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#021d2b"/><stop offset=".55" stop-color="#075379"/><stop offset="1" stop-color="#00a8ff"/></linearGradient>
 <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d1923"/><stop offset="1" stop-color="#04090e"/></linearGradient>
 <filter id="blueGlow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="goldGlow"><feGaussianBlur stdDeviation="5" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <style>
  .road{fill:none;stroke:url(#road);stroke-width:10;stroke-linecap:round;opacity:.78}
  .road2{fill:none;stroke:#39cfff;stroke-width:3;stroke-linecap:round;opacity:.5}
  .water{fill:none;stroke:url(#water);stroke-width:42;stroke-linecap:round;opacity:.48}
  .district{fill:url(#panel);stroke:#d6b46a;stroke-width:3}
  .inner{fill:none;stroke:#00a8ff;stroke-width:2;opacity:.45}
  .label{font-family:Arial,sans-serif;font-weight:800;fill:#f7efd9;text-anchor:middle;letter-spacing:1.5px}
  .small{font-family:Arial,sans-serif;font-size:15px;fill:#9fdfff;text-anchor:middle}
  .gate{fill:#07141e;stroke:#d6b46a;stroke-width:4}
  .gateText{font-family:Arial,sans-serif;font-size:20px;font-weight:900;fill:#f6dfaa;text-anchor:middle}
  .gateSub{font-family:Arial,sans-serif;font-size:13px;fill:#7fe7ff;text-anchor:middle}
 </style>
</defs>
<rect width="1600" height="1000" fill="url(#bg)"/>
