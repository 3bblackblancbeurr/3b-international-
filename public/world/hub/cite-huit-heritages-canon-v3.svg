<path class="water" d="M80 785 C285 660 410 720 555 635 C715 540 870 635 1015 575 C1180 505 1270 620 1510 545"/>
<path class="water" d="M360 930 C540 820 685 840 780 730 C900 590 1080 740 1240 680 C1350 640 1435 725 1540 775"/>
