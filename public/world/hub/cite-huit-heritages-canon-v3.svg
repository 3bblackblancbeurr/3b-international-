<g opacity=".55">
 <rect x="610" y="80" width="26" height="120" fill="#122632" stroke="#d6b46a"/><rect x="645" y="52" width="34" height="150" fill="#0b1821" stroke="#00a8ff"/>
 <rect x="705" y="34" width="42" height="170" fill="#101d26" stroke="#d6b46a"/><rect x="772" y="18" width="40" height="190" fill="#09151f" stroke="#00a8ff"/>
 <rect x="834" y="44" width="34" height="160" fill="#101d26" stroke="#d6b46a"/><rect x="892" y="70" width="28" height="135" fill="#0b1821" stroke="#00a8ff"/>
</g>
<!-- districts -->
<g filter="url(#goldGlow)">
 <ellipse class="district" cx="790" cy="535" rx="150" ry="92"/><ellipse class="inner" cx="790" cy="535" rx="126" ry="70"/>
 <text class="label" x="790" y="525" font-size="28">PLACE DE L’HÉRITAGE</text><text class="small" x="790" y="554">ARRIVÉE · ÉVÉNEMENTS · ORIENTATION</text>
</g>
<g filter="url(#blueGlow)">
 <rect class="district" x="720" y="250" width="140" height="190" rx="25"/><rect x="770" y="205" width="40" height="70" rx="10" fill="#0b2230" stroke="#00a8ff" stroke-width="3"/>
 <text class="label" x="790" y="335" font-size="24">TOUR DU</text><text class="label" x="790" y="365" font-size="24">CERCLE BRISÉ</text><text class="small" x="790" y="397">FRAGMENTS · HISTOIRE · CARTE</text>
</g>
<g><ellipse class="district" cx="510" cy="300" rx="145" ry="78"/><text class="label" x="510" y="292" font-size="22">ARCHIVES DE LA MÉMOIRE</text><text class="small" x="510" y="321">LORE · SOUVENIRS · ÉNIGMES</text></g>
<g><ellipse class="district" cx="1015" cy="325" rx="135" ry="75"/><text class="label" x="1015" y="316" font-size="22">ARÈNE 3B</text><text class="small" x="1015" y="345">DÉFIS · MOBILITÉ · ENTRAÎNEMENT</text></g>
<g><ellipse class="district" cx="1070" cy="535" rx="145" ry="76"/><text class="label" x="1070" y="526" font-size="22">QUARTIER COMMERCE</text><text class="small" x="1070" y="555">CRAFT · GARAGE · CONTRATS</text></g>
<g><ellipse class="district" cx="500" cy="485" rx="145" ry="76"/><text class="label" x="500" y="476" font-size="22">QUARTIER COMMUNAUTÉ</text><text class="small" x="500" y="505">COOP · GROUPES · ÉVÉNEMENTS</text></g>
<g><ellipse class="district" cx="940" cy="205" rx="145" ry="68"/><text class="label" x="940" y="197" font-size="21">INNOVATION &amp; IA</text><text class="small" x="940" y="226">TEXTILE · AVATAR · PROTOTYPES</text></g>
<g><ellipse class="district" cx="660" cy="785" rx="150" ry="72"/><text class="label" x="660" y="777" font-size="21">DOCKS &amp; TRANSPORTS</text><text class="small" x="660" y="806">TRAIN · BATEAUX · FRET</text></g>
<g><ellipse class="district" cx="960" cy="785" rx="145" ry="72"/><text class="label" x="960" y="777" font-size="21">PORTAIL VILLE 3B</text><text class="small" x="960" y="806">CONSTRUIRE · VISITER · ÉVOLUER</text></g>
<g><ellipse class="district" cx="405" cy="735" rx="145" ry="72"/><text class="label" x="405" y="727" font-size="21">JARDINS DE L’UNITÉ</text><text class="small" x="405" y="756">NATURE · MÉMOIRE · SECRETS</text></g>
<!-- gates -->
<g transform="translate(270 230)"><rect class="gate" x="-68" y="-47" width="136" height="94" rx="26"/><text class="gateText" y="-7">FRANCE</text><text class="gateSub" y="20">JUSTICE · CÉLIANE</text></g>
<g transform="translate(625 105)"><rect class="gate" x="-68" y="-47" width="136" height="94" rx="26"/><text class="gateText" y="-7">ESTONIE</text><text class="gateSub" y="20">SAGESSE · EIRA</text></g>
<g transform="translate(1190 175)"><rect class="gate" x="-68" y="-47" width="136" height="94" rx="26"/><text class="gateText" y="-7">TURQUIE</text><text class="gateSub" y="20">FOI · ÉMIR</text></g>
<g transform="translate(1320 430)"><rect class="gate" x="-68" y="-47" width="136" height="94" rx="26"/><text class="gateText" y="-7">ITALIE</text><text class="gateSub" y="20">ESPOIR · ALESSIO</text></g>
<g transform="translate(1215 715)"><rect class="gate" x="-68" y="-47" width="136" height="94" rx="26"/><text class="gateText" y="-7">TUNISIE</text><text class="gateSub" y="20">COURAGE · SORAYA</text></g>
<g transform="translate(1030 885)"><rect class="gate" x="-68" y="-47" width="136" height="94" rx="26"/><text class="gateText" y="-7">ALGÉRIE</text><text class="gateSub" y="20">LOYAUTÉ · YLIANE</text></g>
<g transform="translate(350 825)"><rect class="gate" x="-68" y="-47" width="136" height="94" rx="26"/><text class="gateText" y="-7">MAROC</text><text class="gateSub" y="20">NOBLESSE · NAËL</text></g>
<g transform="translate(150 485)"><rect class="gate" x="-68" y="-47" width="136" height="94" rx="26"/><text class="gateText" y="-7">ESPAGNE</text><text class="gateSub" y="20">PASSION · DIEGO</text></g>
<!-- title -->
<text x="70" y="72" font-family="Arial,sans-serif" font-size="42" font-weight="900" fill="#f1d791">3B INTERNATIONAL</text>
<text x="72" y="105" font-family="Arial,sans-serif" font-size="22" letter-spacing="5" fill="#8fe7ff">LA CITÉ DES HUIT HÉRITAGES</text>
<text x="1480" y="70" text-anchor="end" font-family="Arial,sans-serif" font-size="18" letter-spacing="3" fill="#d6b46a">8 PAYS · 8 VALEURS · 1 MÊME HÉRITAGE</text>
</svg>