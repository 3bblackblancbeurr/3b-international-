<ellipse cx="790" cy="505" rx="470" ry="315" class="road" opacity=".9"/>
<ellipse cx="790" cy="505" rx="330" ry="215" class="road2"/>
<path class="road" d="M790 505 L790 170 M790 505 L1160 275 M790 505 L1250 505 M790 505 L1110 735 M790 505 L790 845 M790 505 L475 745 M790 505 L325 515 M790 505 L470 265"/>
<path class="road2" d="M455 300 C570 405 650 435 790 505 C930 575 1010 640 1110 735"/>
<path class="road2" d="M360 625 C520 600 650 555 790 505 C925 455 1080 430 1230 420"/>
