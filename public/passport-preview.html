<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Validation responsive du Passeport</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #191c22; color: white; font: 14px system-ui, sans-serif; }
    header { display: flex; gap: 20px; align-items: center; padding: 16px; }
    select { font: inherit; padding: 8px; }
    main { display: flex; justify-content: center; padding: 0 12px 24px; }
    iframe { flex: 0 0 auto; width: 390px; height: 844px; border: 0; background: #050607; }
  </style>
</head>
<body>
  <header><label>Largeur de vérification <select id="width"><option value="360">360 px</option><option value="390" selected>390 px</option><option value="768">768 px</option><option value="1280">1280 px</option></select></label><span>Page réelle · aperçu de validation</span></header>
  <main><iframe id="app" title="Application 3B au format choisi" src="/#passeport"></iframe></main>
  <script>
    document.getElementById('width').addEventListener('change', event => {
      document.getElementById('app').style.width = event.target.value + 'px';
    });
  </script>
</body>
</html>
