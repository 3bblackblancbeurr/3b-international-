name: Verify City 3B

on:
  push:
    branches:
      - main
      - release-city3b
    paths:
      - 'src/city/**'
      - 'tests/nexus-city-gateway.test.js'
      - 'tests/city3b-access.test.js'
      - 'tests/city-unlock-guide.test.js'
      - 'supabase/functions/city-3b/**'
      - 'src/world/world.css'
      - 'src/world/WorldPage.jsx'
      - 'src/world/city-unlock-guide.js'
      - 'src/components/NexusCityGateway.jsx'
      - 'src/components/PassportNexus.jsx'
      - 'src/components/PassportVisual.jsx'
      - 'src/styles/city-3b.css'
      - 'tests/city3b.test.js'
      - 'tests/nexus-cinema.test.js'
      - '.github/workflows/verify-city3b-release.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/city/**'
      - 'src/components/NexusCityGateway.jsx'
      - 'src/world/city-unlock-guide.js'
      - 'src/world/WorldPage.jsx'
      - 'src/world/world.css'
      - 'supabase/functions/city-3b/**'
      - 'tests/city-unlock-guide.test.js'
      - 'tests/city3b-access.test.js'
      - 'tests/nexus-city-gateway.test.js'
      - 'src/components/PassportNexus.jsx'
      - 'src/components/PassportVisual.jsx'
      - 'src/styles/city-3b.css'
      - 'tests/city3b.test.js'
      - 'tests/nexus-cinema.test.js'
      - '.github/workflows/verify-city3b-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-city3b-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Verify world
        run: npm run verify