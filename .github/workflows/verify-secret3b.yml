name: Verify Secret 3B

on:
  push:
    branches:
      - chatgpt-improvements
    paths:
      - 'src/secret/**'
      - 'src/components/ComingSoon.jsx'
      - 'supabase/functions/secret3b-phone/**'
      - 'supabase/functions/secret3b-claim/**'
      - 'tests/secret3b.test.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/verify-secret3b.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-secret3b:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: npm ci

      - name: Run Secret 3B tests
        run: node --test tests/secret3b.test.js

      - name: Type-check Secret 3B phone function
        run: deno check supabase/functions/secret3b-phone/index.ts

      - name: Type-check Secret 3B claim function
        run: deno check supabase/functions/secret3b-claim/index.ts

      - name: Build application
        run: npm run build
