name: Verify Secret 3B

on:
  push:
    branches:
      - chatgpt-improvements
    paths:
      - 'src/secret/**'
      - 'src/components/ComingSoon.jsx'
      - 'tests/secret3b.test.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/verify-secret3b.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-secret3b:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build
