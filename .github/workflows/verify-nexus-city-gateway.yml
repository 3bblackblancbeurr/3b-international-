name: Verify Nexus City Gateway

on:
  push:
    branches:
      - main
    paths:
      - 'src/components/NexusCityGateway.jsx'
      - 'src/styles/nexus-city-premium.css'
      - 'src/assets/nexus-bg-part-*.js'
      - 'src/assets/nexus-premium-bg.js'
      - 'tests/nexus-city-gateway.test.js'
      - '.github/workflows/verify-nexus-city-gateway.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/components/NexusCityGateway.jsx'
      - 'src/styles/nexus-city-premium.css'
      - 'src/assets/nexus-bg-part-*.js'
      - 'src/assets/nexus-premium-bg.js'
      - 'tests/nexus-city-gateway.test.js'
      - '.github/workflows/verify-nexus-city-gateway.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-city-gateway-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test Nexus to City gate
        run: node --test tests/nexus-city-gateway.test.js
      - name: Production build
        run: npm run build
