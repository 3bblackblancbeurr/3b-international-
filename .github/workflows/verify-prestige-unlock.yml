name: Verify Prestige Unlock

on:
  pull_request:
    paths:
      - 'src/loyalty/AccountPage.jsx'
      - 'supabase/functions/member-api/**'
      - 'tests/prestige-unlock.test.js'
      - '.github/workflows/verify-prestige-unlock.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --test tests/prestige-unlock.test.js
      - run: npm run build
