name: Verify Monde Invisible
on:
  pull_request:
    paths:
      - 'src/world/invisible/**'
      - 'public/invisible/**'
      - 'src/world/save.js'
      - 'src/world/engine.js'
      - 'src/world/global-rewards.js'
      - 'src/App.jsx'
      - 'src/lib/navigation.js'
      - 'supabase/functions/invisible-guardian/**'
      - 'supabase/functions/world-engine/**'
      - 'supabase/migrations/*invisible*.sql'
      - 'tests/invisible*.test.js'
      - 'tests/hidden-world*.test.js'
      - 'scripts/verify-hidden-world.mjs'
      - 'vercel.json'
      - 'scripts/verify-invisible-browser.mjs'
      - 'scripts/verify-invisible-camera.mjs'
      - '.github/workflows/verify-invisible.yml'
  push:
    branches: [main]
    paths: ['src/world/invisible/**', 'public/invisible/**', 'vercel.json', 'scripts/verify-invisible-browser.mjs', 'scripts/verify-invisible-camera.mjs', 'scripts/verify-hidden-world.mjs', '.github/workflows/verify-invisible.yml']
permissions:
  contents: read
concurrency:
  group: invisible-${{ github.ref }}
  cancel-in-progress: true
jobs:
  adventure:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify campaign, permissions, rewards and sensor lifecycle
        run: node --test tests/invisible*.test.js tests/hidden-world*.test.js
      - run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Verify hidden world menu, empty missions, scanner and camera cleanup
        run: node scripts/verify-hidden-world.mjs
        env:
          PLAYWRIGHT_MODULE: '@playwright/test'
          HIDDEN_WORLD_TEST_OUT: artifacts/hidden-world
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: monde-invisible-browser
          path: |
            artifacts/hidden-world/
          retention-days: 7
