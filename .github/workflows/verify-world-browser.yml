name: Verify World browser journeys
on:
  pull_request:
    paths:
      - 'src/world/**'
      - 'scripts/verify-world-continuation-browser.mjs'
      - '.github/workflows/verify-world-browser.yml'
  push:
    branches: [main]
    paths:
      - 'src/world/**'
      - 'scripts/verify-world-continuation-browser.mjs'
      - '.github/workflows/verify-world-browser.yml'
permissions:
  contents: read
concurrency:
  group: world-browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install isolated browser tools
        run: |
          npm install --prefix "$RUNNER_TEMP/world-browser-tools" --no-package-lock playwright@1.56.1
          "$RUNNER_TEMP/world-browser-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Desktop, touch, save recovery and tournament journeys
        run: |
          npm run dev > "$RUNNER_TEMP/world-vite.log" 2>&1 &
          WORLD_VITE_PID=$!
          trap 'kill "$WORLD_VITE_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then break; fi
            sleep 1
          done
          WORLD_PLAYWRIGHT_MODULE="$RUNNER_TEMP/world-browser-tools/node_modules/playwright/index.mjs" \
          WORLD_TEST_OUT="$RUNNER_TEMP/world-browser-report" \
          node scripts/verify-world-continuation-browser.mjs
      - name: Browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: world-browser-${{ github.sha }}
          path: |
            ${{ runner.temp }}/world-browser-report
            ${{ runner.temp }}/world-vite.log
