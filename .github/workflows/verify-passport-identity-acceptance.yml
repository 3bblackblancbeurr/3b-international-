name: Verify Passport Identity Acceptance

on:
  pull_request:
    paths:
      - '.env.example'
      - 'public/privacy-policy.html'
      - 'public/account-terms.html'
      - 'public/delete-account.html'
      - 'docs/passport/**'
      - 'docs/legal/**'
      - 'docs/security/**'
      - 'src/passport/**'
      - 'supabase/functions/member-auth/**'
      - 'supabase/functions/delete-account/**'
      - 'supabase/functions/passport-identity/**'
      - 'supabase/functions/passport-verify/**'
      - 'supabase/migrations/**passport**'
      - 'supabase/migrations/*identity*'
      - 'scripts/verify-passport-acceptance-readiness.mjs'
      - '.github/workflows/verify-passport-identity-acceptance.yml'
  push:
    branches: [main]
    paths:
      - '.env.example'
      - 'public/privacy-policy.html'
      - 'public/account-terms.html'
      - 'public/delete-account.html'
      - 'docs/passport/**'
      - 'docs/legal/**'
      - 'docs/security/**'
      - 'src/passport/**'
      - 'supabase/functions/member-auth/**'
      - 'supabase/functions/delete-account/**'
      - 'supabase/functions/passport-identity/**'
      - 'supabase/functions/passport-verify/**'
      - 'supabase/migrations/**passport**'
      - 'supabase/migrations/*identity*'
      - 'scripts/verify-passport-acceptance-readiness.mjs'
      - '.github/workflows/verify-passport-identity-acceptance.yml'

permissions:
  contents: read

jobs:
  passport-identity-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Verify Passport identity acceptance foundation
        run: node scripts/verify-passport-acceptance-readiness.mjs
      - name: Run Passport trust tests
        run: node --test tests/passport-identity-trust.test.js tests/passport-access-gate.test.js tests/passport-identity.test.js
