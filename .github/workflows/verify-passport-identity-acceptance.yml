name: Verify Passport Identity Acceptance

on:
  pull_request:
    paths:
      - '.env.example'
      - 'public/privacy-policy.html'
      - 'public/account-terms.html'
      - 'public/delete-account.html'
      - 'docs/passport/**'
      - 'docs/legal/**'
      - 'docs/security/**'
      - 'src/passport/**'
      - 'supabase/functions/member-auth/**'
      - 'supabase/functions/delete-account/**'
      - 'supabase/functions/passport-identity/**'
      - 'supabase/functions/passport-verify/**'
      - 'supabase/functions/passport-idv/**'
      - 'supabase/functions/passport-partner/**'
      - 'supabase/functions/passport-passkeys/**'
      - 'supabase/functions/_shared/passport-*'
      - 'tests/passport-*.test.js'
      - 'supabase/migrations/**passport**'
      - 'supabase/migrations/*identity*'
      - 'scripts/verify-passport-acceptance-readiness.mjs'
      - '.github/workflows/verify-passport-identity-acceptance.yml'
  push:
    branches: [main]
    paths:
      - '.env.example'
      - 'public/privacy-policy.html'
      - 'public/account-terms.html'
      - 'public/delete-account.html'
      - 'docs/passport/**'
      - 'docs/legal/**'
      - 'docs/security/**'
      - 'src/passport/**'
      - 'supabase/functions/member-auth/**'
      - 'supabase/functions/delete-account/**'
      - 'supabase/functions/passport-identity/**'
      - 'supabase/functions/passport-verify/**'
      - 'supabase/functions/passport-idv/**'
      - 'supabase/functions/passport-partner/**'
      - 'supabase/functions/passport-passkeys/**'
      - 'supabase/functions/_shared/passport-*'
      - 'tests/passport-*.test.js'
      - 'supabase/migrations/**passport**'
      - 'supabase/migrations/*identity*'
      - 'scripts/verify-passport-acceptance-readiness.mjs'
      - '.github/workflows/verify-passport-identity-acceptance.yml'

permissions:
  contents: read

jobs:
  passport-identity-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify Passport identity acceptance foundation
        run: node scripts/verify-passport-acceptance-readiness.mjs
      - name: Run Passport trust tests
        run: node --test tests/passport-*.test.js
      - name: Check identity provider function
        run: npm exec --yes --package=deno@2.9.6 -- deno check --frozen --config supabase/functions/passport-idv/deno.json supabase/functions/passport-idv/index.ts
      - name: Check passkey function
        run: npm exec --yes --package=deno@2.9.6 -- deno check --frozen --config supabase/functions/passport-passkeys/deno.json supabase/functions/passport-passkeys/index.ts
      - name: Verify real WebAuthn signatures and rejection cases
        run: npm exec --yes --package=deno@2.9.6 -- deno test --frozen --config supabase/functions/passport-passkeys/deno.json supabase/functions/passport-passkeys/
      - name: Check partner function
        run: npm exec --yes --package=deno@2.9.6 -- deno check --no-lock --config supabase/functions/passport-partner/deno.json supabase/functions/passport-partner/index.ts
