name: Notify search engines with IndexNow

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'public/**'
      - 'scripts/submit-indexnow.mjs'
      - '.github/workflows/indexnow.yml'
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow-production
  cancel-in-progress: true

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Notify IndexNow-enabled search engines
        run: node scripts/submit-indexnow.mjs
