name: Notify search engines with IndexNow

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'public/**'
      - 'scripts/submit-indexnow.mjs'
      - '.github/workflows/indexnow.yml'
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow-production
  cancel-in-progress: true

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Notify IndexNow-enabled search engines
        run: node scripts/submit-indexnow.mjs
