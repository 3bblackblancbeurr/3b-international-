name: Verify Unreal Canonical Foundation

on:
  pull_request:
    paths:
      - 'unreal/**'
      - 'LANCER_HUB_3B.bat'
      - 'scripts/windows/Launch-Hub3B.ps1'
      - 'supabase/functions/world-unreal-*/**'
      - 'supabase/functions/ai-council-orchestrate/**'
      - 'supabase/migrations/**ai_council**'
      - 'scripts/threeb-unreal-bridge.mjs'
      - 'src/world/hub/data/**'
      - 'tests/unreal-preproduction-contract.test.js'
      - 'tests/hub-unreal-v5-premium.test.js'
      - 'tests/france-unreal-contract.test.js'
      - 'tests/france-preproduction-depth.test.js'
      - 'tests/france-handoff-coop-editor.test.js'
      - 'tests/france-editor-readiness.test.js'
      - 'tests/france-vertical-world.test.js'
      - 'tests/france-goldmaster-gate.test.js'
      - 'tests/world-unreal-story-state-contract.test.js'
      - 'tests/ai-council-unreal-bridge.test.js'
      - '.github/workflows/verify-unreal-preproduction.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify canonical France and Unreal contracts
        run: >-
          node --test
          tests/unreal-preproduction-contract.test.js
          tests/france-unreal-contract.test.js
          tests/france-preproduction-depth.test.js
          tests/france-handoff-coop-editor.test.js
          tests/france-editor-readiness.test.js
          tests/france-vertical-world.test.js
          tests/france-goldmaster-gate.test.js
          tests/world-unreal-story-state-contract.test.js
          tests/hub-unreal-v5-premium.test.js
      - run: node --test tests/ai-council-unreal-bridge.test.js
      - name: Validate canonical Unreal editor Python syntax
        run: >-
          python -m py_compile
          unreal/ThreeBWorld/Scripts/build_metropolis_blockout.py
          unreal/ThreeBWorld/Scripts/validate_france_editor_assets.py
          unreal/ThreeBWorld/Scripts/build_france_blockout.py
          unreal/ThreeBWorld/Scripts/bootstrap_france_goldmaster_assets.py
          unreal/ThreeBWorld/Scripts/prepare_france_goldmaster.py
          unreal/ThreeBWorld/Scripts/france_goldmaster_gate.py
          unreal/ThreeBWorld/Scripts/build_hub3b_void_blockout_v3.py
          unreal/ThreeBWorld/Scripts/build_hub3b_main_v4.py
          unreal/ThreeBWorld/Scripts/build_hub3b_main_v5.py
          unreal/ThreeBWorld/Content/Python/init_unreal.py
      - name: Validate Hub 3B V05 one-click manifest and launcher contract
        run: |
          python -m json.tool unreal/ThreeBWorld/Data/Production/hub3b-main-v5-premium.json >/dev/null
          python -m json.tool unreal/ThreeBWorld/Data/Production/world-layout-unreal.json >/dev/null
          test -f LANCER_HUB_3B.bat
          test -f scripts/windows/Launch-Hub3B.ps1
          grep -q -- "-3BHubV5AutoBuild" scripts/windows/Launch-Hub3B.ps1 unreal/ThreeBWorld/Content/Python/init_unreal.py
          grep -q "build_hub3b_main_v5.py" scripts/windows/Launch-Hub3B.ps1 unreal/ThreeBWorld/Content/Python/init_unreal.py

      - name: Validate Hub 3B V05 metropolitan canon
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path

          data = json.loads(Path("unreal/ThreeBWorld/Data/Production/hub3b-main-v5-premium.json").read_text(encoding="utf-8"))
          layout = json.loads(Path("unreal/ThreeBWorld/Data/Production/world-layout-unreal.json").read_text(encoding="utf-8"))

          assert data["required_map_name"] == "Hub3B_Main_V05"
          assert data["visual_reference"] == "user-master://La Cité des Huit Héritages"
          assert data["world"]["district_count"] == 10
          assert data["world"]["canonical_building_count"] == 19
          assert data["world"]["portal_count"] == 8
          assert len(data["portals"]) == 8
          assert len(data["vertical_links"]) == 8
          assert len(data["water_network"]["features"]) >= 5
          assert len(data["landmarks"]) >= 10
          assert data["safe_zone"]["hubIsOnlyMajorSafeZone"] is True
          assert data["safe_zone"]["monsters"] is False
          assert data["validation"]["forbid_even_45_degree_portal_ring"] is True
          assert data["validation"]["forbid_legacy_ring_spokes_petals"] is True

          gates = {g["id"]: g["location_cm"] for g in layout["gates"]}
          region_for = {p["code"]: p["region_id"] for p in data["portals"]}
          for portal in data["portals"]:
              assert portal["location_cm"] == gates[region_for[portal["code"]]]
              assert portal["state"] == "prepared-dispersed"

          angles = sorted((math.degrees(math.atan2(p["location_cm"]["y"], p["location_cm"]["x"])) + 360) % 360 for p in data["portals"])
          diffs = [((angles[(i+1)%8]-angles[i])%360) for i in range(8)]
          assert any(abs(d-45.0) > 2.0 for d in diffs), diffs

          raw = json.dumps(data)
          for forbidden in ['"ring"', '"spokes"', '"petals"']:
              assert forbidden not in raw, forbidden

          print("Hub 3B V05 metropolitan canon: OK")
          PY
