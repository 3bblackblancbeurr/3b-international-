name: Verify Unreal Canonical Foundation

on:
  pull_request:
    paths:
      - 'unreal/**'
      - 'supabase/functions/world-unreal-*/**'
      - 'supabase/functions/ai-council-orchestrate/**'
      - 'supabase/migrations/**ai_council**'
      - 'scripts/threeb-unreal-bridge.mjs'
      - 'src/world/hub/data/**'
      - 'tests/unreal-preproduction-contract.test.js'
      - 'tests/ai-council-unreal-bridge.test.js'
      - '.github/workflows/verify-unreal-preproduction.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test tests/unreal-preproduction-contract.test.js
      - run: node --test tests/ai-council-unreal-bridge.test.js
      - name: Validate canonical Unreal editor Python syntax
        run: python -m py_compile unreal/ThreeBWorld/Scripts/build_metropolis_blockout.py
