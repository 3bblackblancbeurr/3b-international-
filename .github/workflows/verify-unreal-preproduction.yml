name: Verify Unreal Canonical Foundation

on:
  pull_request:
    paths:
      - 'unreal/**'
      - 'LANCER_HUB_3B.bat'
      - 'scripts/windows/Launch-Hub3B.ps1'
      - 'supabase/functions/world-unreal-*/**'
      - 'supabase/functions/ai-council-orchestrate/**'
      - 'supabase/migrations/**ai_council**'
      - 'scripts/threeb-unreal-bridge.mjs'
      - 'src/world/hub/data/**'
      - 'tests/unreal-preproduction-contract.test.js'
      - 'tests/france-unreal-contract.test.js'
      - 'tests/france-preproduction-depth.test.js'
      - 'tests/france-handoff-coop-editor.test.js'
      - 'tests/france-editor-readiness.test.js'
      - 'tests/france-vertical-world.test.js'
      - 'tests/france-goldmaster-gate.test.js'
      - 'tests/world-unreal-story-state-contract.test.js'
      - 'tests/ai-council-unreal-bridge.test.js'
      - '.github/workflows/verify-unreal-preproduction.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify canonical France and Unreal contracts
        run: >-
          node --test
          tests/unreal-preproduction-contract.test.js
          tests/france-unreal-contract.test.js
          tests/france-preproduction-depth.test.js
          tests/france-handoff-coop-editor.test.js
          tests/france-editor-readiness.test.js
          tests/france-vertical-world.test.js
          tests/france-goldmaster-gate.test.js
          tests/world-unreal-story-state-contract.test.js
      - run: node --test tests/ai-council-unreal-bridge.test.js
      - name: Validate canonical Unreal editor Python syntax
        run: >-
          python -m py_compile
          unreal/ThreeBWorld/Scripts/build_metropolis_blockout.py
          unreal/ThreeBWorld/Scripts/validate_france_editor_assets.py
          unreal/ThreeBWorld/Scripts/build_france_blockout.py
          unreal/ThreeBWorld/Scripts/bootstrap_france_goldmaster_assets.py
          unreal/ThreeBWorld/Scripts/prepare_france_goldmaster.py
          unreal/ThreeBWorld/Scripts/france_goldmaster_gate.py
          unreal/ThreeBWorld/Scripts/build_hub3b_void_blockout_v3.py
          unreal/ThreeBWorld/Scripts/build_hub3b_main_v4.py
          unreal/ThreeBWorld/Content/Python/init_unreal.py
      - name: Validate Hub 3B one-click manifest and launcher contract
        run: |
          python -m json.tool unreal/ThreeBWorld/Data/Production/hub3b-void-blockout-v3.json >/dev/null
          python -m json.tool unreal/ThreeBWorld/Data/Production/hub3b-main-v4.json >/dev/null
          test -f LANCER_HUB_3B.bat
          test -f scripts/windows/Launch-Hub3B.ps1
          grep -q -- "-3BHubV4AutoBuild" scripts/windows/Launch-Hub3B.ps1 unreal/ThreeBWorld/Content/Python/init_unreal.py
          grep -q "build_hub3b_main_v4.py" scripts/windows/Launch-Hub3B.ps1 unreal/ThreeBWorld/Content/Python/init_unreal.py
