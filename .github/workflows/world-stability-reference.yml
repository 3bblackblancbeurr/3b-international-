name: World stability reference
on:
  pull_request:
    paths:
      - 'src/world/**'
      - 'tests/world-stability-candidate.test.js'
      - 'scripts/verify-world-stability-browser.mjs'
      - '.github/workflows/world-stability-reference.yml'
permissions:
  contents: read
concurrency:
  group: world-stability-reference-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test tests/world-stability-candidate.test.js tests/world-motion-budget.test.js tests/adaptive-quality.test.js tests/realm-final-art.test.js tests/realm-terrain-skirts.test.js tests/world-running-stutters.test.js
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx --no-install playwright install --with-deps chromium
      - run: node scripts/verify-world-stability-browser.mjs
        env:
          WORLD_STABILITY_OUT: ${{ runner.temp }}/world-stability-reference
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: world-stability-reference
          path: ${{ runner.temp }}/world-stability-reference
          if-no-files-found: warn
