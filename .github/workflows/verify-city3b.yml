name: Verify City 3B

on:
  push:
    branches:
      - chatgpt-improvements
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-city3b-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Verify world
        run: npm run verify

      - name: Production build
        run: npm run build
