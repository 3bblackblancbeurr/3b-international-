name: Verify Application Navigation
on:
  workflow_dispatch:
  pull_request:
    paths: ['src/components/WorldPortalCard.jsx', 'src/components/WorldStoryPreview.jsx', 'src/components/world-story-preview.css', 'src/components/BrokenCircle3D.jsx', 'src/components/scene-frame-loop.js', 'scripts/verify-app-experience.mjs', 'src/components/AppNavigation.jsx', 'src/components/navigation-menu.js', 'src/components/GuidePage.jsx', 'src/design-system/LuxuryExperience.jsx', 'src/styles/application-ui.css', 'src/main.jsx', 'src/App.jsx', 'src/maintenant/**', 'src/components/HomePage.jsx', 'src/components/LivingWorldHome.jsx', 'src/components/AlbertPublicPreview.jsx', 'src/components/AlbertDailyTimeline.jsx', 'src/components/WorldRealmSpotlight.jsx', 'src/components/WorldNowFeed.jsx', 'src/components/world-realm-stories.js', 'src/components/world-editorial-pathways.js', 'src/components/albert-local-plan.js', 'src/styles/world-living-home.css', 'src/styles/world-living-cinema.css', 'src/styles/albert-daily-timeline.css', 'tests/world-cinematic-experience.test.js', 'tests/albert-daily-timeline.test.js', 'scripts/verify-world-living-ui.mjs', 'src/components/application-menu-events.js', 'src/lib/navigation.js', 'src/loyalty/AccountPage.jsx', 'src/member/**', 'src/health/FoodScanner.jsx', 'src/health/foodBarcode.js', 'src/health/HealthPage.jsx', 'api/food-product.js', 'api/member-brief.js', 'tests/member-expansion.test.js', 'tests/public-spaces-navigation.test.js', 'src/companion/CompanionLayer.jsx', 'src/world/WorldPage.jsx', 'src/world/WorldSettingsPanel.jsx', 'src/world/invisible/CampaignExperience.jsx', 'src/shop/ShopPage.jsx', 'tests/application-menu.test.js', 'scripts/verify-application-ui.mjs', '.github/workflows/verify-application-ui.yml', 'package.json', 'package-lock.json']
  push:
    branches: [main]
    paths: ['src/components/WorldPortalCard.jsx', 'src/components/WorldStoryPreview.jsx', 'src/components/world-story-preview.css', 'src/components/BrokenCircle3D.jsx', 'src/components/scene-frame-loop.js', 'scripts/verify-app-experience.mjs', 'src/styles/application-ui.css', 'src/maintenant/**', 'src/components/AppNavigation.jsx', 'src/components/navigation-menu.js', 'package.json', 'package-lock.json', 'src/App.jsx', 'src/components/HomePage.jsx', 'src/components/LivingWorldHome.jsx', 'src/components/LivingWorldGlobe.jsx', 'src/components/WorldRealmSpotlight.jsx', 'src/components/WorldNowFeed.jsx', 'src/components/AlbertPublicPreview.jsx', 'src/components/AlbertDailyTimeline.jsx', 'src/components/AlbertHologramAvatar.jsx', 'src/components/world-city-lights.js', 'src/components/world-realm-stories.js', 'src/components/world-editorial-pathways.js', 'src/components/albert-local-plan.js', 'src/styles/world-living-home.css', 'src/styles/world-living-cinema.css', 'src/styles/albert-daily-timeline.css', 'scripts/verify-world-living-ui.mjs', 'tests/world-cinematic-lighting.test.js', 'tests/world-cinematic-experience.test.js', 'tests/world-living-home.test.js']
permissions:
  contents: read
concurrency:
  group: application-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test tests/application-menu.test.js tests/home-premium-navigation.test.js tests/navigation-links.test.js tests/member-navigation.test.js tests/luxury-experience.test.js tests/companion-preferences.test.js
      - run: node --test tests/world-cinematic-experience.test.js tests/albert-daily-timeline.test.js
      - run: node --test tests/maintenant.test.js
      - run: node --test tests/member-expansion.test.js tests/public-spaces-navigation.test.js
      - run: node --test tests/travel-notebook.test.js tests/admin-journey.test.js tests/collaboration-studio.test.js tests/media-library.test.js tests/manga-library.test.js
      - run: npm run build
      - run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/verify-world-living-ui.mjs
        env:
          WORLD_LIVING_QA_OUT: artifacts/application-ui/world-living
      - run: node scripts/verify-application-ui.mjs
        env:
          APP_UI_OUT: artifacts/application-ui
      - run: node scripts/verify-food-scanner-ui.mjs
        env:
          FOOD_SCANNER_UI_OUT: artifacts/application-ui/food-scanner
      - run: node scripts/verify-member-universe-ui.mjs
        env:
          MEMBER_UI_OUT: artifacts/application-ui/member-universe
      - run: node scripts/verify-premium-modules-ui.mjs
        env:
          PREMIUM_MODULES_UI_OUT: artifacts/application-ui/premium-modules
      - run: node scripts/verify-manga-library-ui.mjs
        env:
          MANGA_UI_OUT: artifacts/application-ui/manga
      - run: node scripts/verify-app-experience.mjs
        env:
          APP_EXPERIENCE_QA_OUT: artifacts/application-ui/experience
      - run: node scripts/verify-maintenant-ui.mjs
        env:
          NOW_UI_OUT: artifacts/application-ui/maintenant
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: application-ui-browser
          path: artifacts/application-ui/
          retention-days: 7
