name: Verify 3B Gold Master Foundation
on:
  pull_request:
    paths:
      - 'brand/master/**'
      - 'src/design-system/**'
      - 'src/city/city3b-game.css'
      - 'src/city/city3b-model-preview.js'
      - 'src/passport/identity.js'
      - 'supabase/functions/member-api/index.ts'
      - 'tests/passport-identity.test.js'
      - 'tests/gold-master-passport-public-id.test.js'
      - 'src/styles/gold-master.css'
      - 'src/main.jsx'
      - 'public/manifest.webmanifest'
      - 'index.html'
      - 'scripts/verify-brand-vault.mjs'
      - 'tests/brand-vault.test.js'
      - 'tests/gold-master-design-system.test.js'
      - 'tests/gold-master-*.test.js'
      - 'scripts/verify-gold-master-diff.mjs'
      - 'package.json'
      - '.github/workflows/verify-gold-master-foundation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-gold-master:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify brand vault
        run: npm run brand:verify
      - name: Test Gold Master contracts
        run: npm run test:gold-master
      - name: Block new visual drift
        run: npm run gold-master:guard
      - name: Build application
        run: npm run build
