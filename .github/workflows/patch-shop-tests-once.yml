name: Patch outdated shop tests once

on:
  push:
    branches:
      - chatgpt-mobile-clean-20260917

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-mobile-clean-20260917
      - name: Patch catalogue fixtures
        run: python scripts/patch-shop-tests-current-catalog.py
      - name: Commit compatibility update when needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/shop.test.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "test: shop-tests-current-catalog"
          git push origin HEAD:chatgpt-mobile-clean-20260917
