name: Verify Health 3B Mobile Experience

on:
  pull_request:
    paths:
      - 'src/health/**'
      - 'scripts/verify-health-browser.mjs'
      - '.github/workflows/verify-health-qa.yml'
  push:
    branches: [main]
    paths:
      - 'src/health/**'
      - 'scripts/verify-health-browser.mjs'
      - '.github/workflows/verify-health-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: health-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify production frontend builds
        run: npm run build
      - name: Install browser QA
        run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Exercise the real Health app at 320px and 390px
        run: node scripts/verify-health-browser.mjs
        env:
          HEALTH_UI_OUT: artifacts/health-browser
      - name: Store Santé mobile visual proof and results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: 3b-health-mobile-browser
          path: artifacts/health-browser/
          if-no-files-found: warn
          retention-days: 7
