name: World persistence release check
on:
  push:
    branches: [chatgpt-improvements-world-consolidation-20260920]
    paths: [.github/workflows/world-persistence-release-check.yml]
permissions:
  contents: write
  statuses: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      candidate: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Apply reviewed server-compatibility fix without changing the backend or player data
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:src/world/WorldPage.jsx)" = 21be8f9a329400512931c868e05e64c9fd877a5a
          python3 scripts/apply-world-persistence-compat.py
          test "$(git hash-object src/world/WorldPage.jsx)" = 1bd8f94dda7d1a21b3b51bb30d6bc804ddc4947c
          test "$(git hash-object src/world/cinematic-persistence.js)" = 87af672a491f931aa28cc8c7de289e682687f7d9
          test "$(git hash-object tests/cinematic-persistence.test.js)" = 31ff26984edcdd128c48f65d124a5f726e0f56c6
          git diff --check
      - run: npm ci --no-audit --no-fund
      - run: node --test tests/cinematic-persistence.test.js tests/cinematic-camera.test.js tests/world-onboarding-lifecycle.test.js tests/builtin-icon-shadowing.test.js tests/cinematics-gold-master.test.js && npm run build
      - name: Publish reviewed correction only to the candidate branch
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TARGET=chatgpt-improvements-world-consolidation-20260920
          test "$GITHUB_REF" = "refs/heads/$TARGET"
          test "$(git ls-remote origin "refs/heads/$TARGET" | cut -f1)" = "$GITHUB_SHA"
          git config user.name '3B Integration'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/world/WorldPage.jsx src/world/cinematic-persistence.js tests/cinematic-persistence.test.js
          git commit -m 'fix(world): keep memory presentations compatible with authoritative server saves'
          cat > "$RUNNER_TEMP/git-askpass" <<'SH'
          #!/bin/sh
          case "$1" in *Username*) printf '%s\n' x-access-token;; *) printf '%s\n' "$GH_TOKEN";; esac
          SH
          chmod 700 "$RUNNER_TEMP/git-askpass"
          GIT_ASKPASS="$RUNNER_TEMP/git-askpass" GIT_TERMINAL_PROMPT=0 git push origin "HEAD:refs/heads/$TARGET"
          rm -f "$RUNNER_TEMP/git-askpass"
          CANDIDATE=$(git rev-parse HEAD)
          echo "sha=$CANDIDATE" >> "$GITHUB_OUTPUT"
          for CHECK in threeb/release-browser threeb/release-verify; do
            gh api "repos/$GITHUB_REPOSITORY/statuses/$CANDIDATE" -f state=pending -f context="$CHECK" -f description='Checking final server-compatible candidate' -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          done
  browser:
    needs: repair
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.repair.outputs.candidate }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund && npm run build
      - run: npm install --no-save --package-lock=false @playwright/test@1.56.1 && npx playwright install --with-deps chromium
      - name: Check avatar creation, cinematics, game entry and save reload
        id: test
        run: |
          set -euo pipefail
          mkdir -p artifacts/world-release
          npm run preview -- --host 127.0.0.1 --port 4173 > artifacts/world-release/preview.log 2>&1 &
          SERVER=$!; trap 'kill "$SERVER" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do if curl -sf http://127.0.0.1:4173/ >/dev/null; then break; fi; sleep 1; done
          node scripts/verify-world-release-browser.mjs
      - name: Record actual browser outcome
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.test.outcome }}
          CANDIDATE: ${{ needs.repair.outputs.candidate }}
        run: |
          STATE=failure; test "$RESULT" = success && STATE=success
          gh api "repos/$GITHUB_REPOSITORY/statuses/$CANDIDATE" -f state="$STATE" -f context=threeb/release-browser -f description="Desktop and touch: $RESULT" -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: world-persistence-browser
          path: artifacts/world-release/
          retention-days: 7
  verify:
    needs: repair
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.repair.outputs.candidate }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Full regression and production build
        id: test
        run: |
          set -euo pipefail
          npm run verify | tee /tmp/world-verify.log
      - name: Record actual complete verification outcome
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.test.outcome }}
          CANDIDATE: ${{ needs.repair.outputs.candidate }}
        run: |
          STATE=failure; test "$RESULT" = success && STATE=success
          gh api "repos/$GITHUB_REPOSITORY/statuses/$CANDIDATE" -f state="$STATE" -f context=threeb/release-verify -f description="Full regression and build: $RESULT" -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: world-persistence-verify
          path: /tmp/world-verify.log
          retention-days: 7
