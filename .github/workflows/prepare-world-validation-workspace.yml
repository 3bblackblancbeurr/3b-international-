name: Prepare World validation workspace
on:
  push:
    branches: [chatgpt-improvements-world-consolidation-20260920]
    paths: ['.github/workflows/prepare-world-validation-workspace.yml']
permissions:
  contents: read
jobs:
  export-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Package Git objects and locked dependencies only
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/world-validation-workspace"
          mkdir -p "$OUT"
          git bundle create "$OUT/source.bundle" --all
          tar -czf "$OUT/node_modules.tar.gz" node_modules
          git rev-parse HEAD > "$OUT/source-sha.txt"
          node --version > "$OUT/node-version.txt"
          cd "$OUT"
          sha256sum source.bundle node_modules.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: world-validation-workspace-${{ github.run_id }}
          path: ${{ runner.temp }}/world-validation-workspace/
          compression-level: 0
          retention-days: 1
