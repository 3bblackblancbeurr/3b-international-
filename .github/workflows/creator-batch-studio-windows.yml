name: Creator Batch Studio Windows

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/creator_batch_studio/**"
      - ".github/workflows/creator-batch-studio-windows.yml"
  push:
    branches:
      - main
    paths:
      - "tools/creator_batch_studio/**"
      - ".github/workflows/creator-batch-studio-windows.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: tools/creator_batch_studio/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r tools/creator_batch_studio/requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tools/creator_batch_studio/tests -v

      - name: Build one-file Windows executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name CreatorBatchStudio tools/creator_batch_studio/creator_batch_studio.py

      - name: Smoke-test packaged Windows executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force smoke/input | Out-Null
          New-Item -ItemType Directory -Force smoke/output | Out-Null
          python -c "from PIL import Image; Image.new('RGB',(640,360),'navy').save('smoke/input/smoke.jpg')"
          $exe = (Resolve-Path "dist/CreatorBatchStudio.exe").Path
          $inputDir = (Resolve-Path "smoke/input").Path
          $outputDir = (Resolve-Path "smoke/output").Path
          $process = Start-Process -FilePath $exe -ArgumentList @("--input",$inputDir,"--output",$outputDir,"--format","webp","--quality","82","--prefix","SMOKE","--preset","instagram_square","--preset","youtube_thumbnail") -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 0) { throw "Packaged EXE smoke test failed with exit code $($process.ExitCode)" }
          python -c "import json; from pathlib import Path; from PIL import Image; p=Path('smoke/output'); r=json.loads((p/'creator_batch_report.json').read_text(encoding='utf-8')); assert r['created_outputs']==2 and r['failed_files']==0, r; sizes=sorted(Image.open(x['output']).size for x in r['outputs']); assert sizes==[(1080,1080),(1280,720)], sizes"

      - name: Collect third-party license notices
        shell: pwsh
        run: |
          python -c "from importlib.metadata import distribution; from pathlib import Path; d=distribution('Pillow'); f=next(x for x in d.files if Path(str(x)).name.upper() == 'LICENSE'); src=Path(d.locate_file(f)); Path('dist/Pillow-LICENSE.txt').write_bytes(src.read_bytes())"
          if (-not (Test-Path "dist/Pillow-LICENSE.txt")) { throw "Pillow license notice was not collected" }

      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler was not found" }
          & $iscc "tools\creator_batch_studio\installer\CreatorBatchStudio.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path "dist\CreatorBatchStudio-Setup-v1.0.0.exe")) { throw "Installer was not produced" }

      - name: Install, process an image, and uninstall
        shell: pwsh
        run: |
          $installer = (Resolve-Path "dist\CreatorBatchStudio-Setup-v1.0.0.exe").Path
          $installDir = Join-Path $env:RUNNER_TEMP "CreatorBatchStudioInstall"
          $testInput = Join-Path $env:RUNNER_TEMP "cbs-installed-input"
          $testOutput = Join-Path $env:RUNNER_TEMP "cbs-installed-output"
          New-Item -ItemType Directory -Force $testInput,$testOutput | Out-Null
          python -c "from PIL import Image; import sys; Image.new('RGB',(800,600),'white').save(sys.argv[1])" (Join-Path $testInput "installed.jpg")

          $install = Start-Process -FilePath $installer -ArgumentList @("/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART",("/DIR=" + $installDir)) -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Silent installer failed with exit code $($install.ExitCode)" }

          $installedExe = Join-Path $installDir "CreatorBatchStudio.exe"
          if (-not (Test-Path $installedExe)) { throw "Installed EXE missing" }
          $run = Start-Process -FilePath $installedExe -ArgumentList @("--input",$testInput,"--output",$testOutput,"--format","webp","--quality","80","--prefix","INSTALL","--preset","web_large") -Wait -PassThru -NoNewWindow
          if ($run.ExitCode -ne 0) { throw "Installed EXE smoke test failed with exit code $($run.ExitCode)" }
          python -c "import json,sys; from pathlib import Path; p=Path(sys.argv[1]); r=json.loads((p/'creator_batch_report.json').read_text(encoding='utf-8')); assert r['created_outputs']==1 and r['failed_files']==0, r" $testOutput

          $uninstaller = Join-Path $installDir "unins000.exe"
          if (-not (Test-Path $uninstaller)) { throw "Uninstaller missing" }
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @("/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART") -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Silent uninstall failed with exit code $($uninstall.ExitCode)" }
          if (Test-Path $installedExe) { throw "Installed executable remained after uninstall" }

      - name: Package distribution and SHA-256
        shell: pwsh
        run: |
          Compress-Archive -Path dist/CreatorBatchStudio.exe,dist/CreatorBatchStudio-Setup-v1.0.0.exe,tools/creator_batch_studio/README.md,tools/creator_batch_studio/QUICK_START.md,tools/creator_batch_studio/FAQ.md,tools/creator_batch_studio/LICENSE.txt,dist/Pillow-LICENSE.txt -DestinationPath dist/CreatorBatchStudio-Windows-x64-v1.0.0.zip -Force
          Get-FileHash dist/CreatorBatchStudio-Windows-x64-v1.0.0.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  CreatorBatchStudio-Windows-x64-v1.0.0.zip" } | Set-Content -Encoding ascii dist/CreatorBatchStudio-Windows-x64-v1.0.0.sha256
          Get-FileHash dist/CreatorBatchStudio-Setup-v1.0.0.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  CreatorBatchStudio-Setup-v1.0.0.exe" } | Set-Content -Encoding ascii dist/CreatorBatchStudio-Setup-v1.0.0.sha256

      - name: Upload Windows package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CreatorBatchStudio-Windows-x64-v1.0.0
          path: |
            dist/CreatorBatchStudio.exe
            dist/CreatorBatchStudio-Setup-v1.0.0.exe
            dist/CreatorBatchStudio-Windows-x64-v1.0.0.zip
            dist/CreatorBatchStudio-Windows-x64-v1.0.0.sha256
            dist/CreatorBatchStudio-Setup-v1.0.0.sha256
          if-no-files-found: error
          retention-days: 30
