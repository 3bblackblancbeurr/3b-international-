name: Verify Sport H24 and Finals

on:
  pull_request:
    paths:
      - 'src/sport/**'
      - 'server/sport-live.js'
      - 'api/catalog.js'
      - 'tests/sport*.test.js'
      - 'public/sport-player-shell.html'
      - 'public/sport-player-shell.js'
      - 'scripts/check-sport-video-sources.mjs'
      - 'src/sport/source-health.js'
      - 'public/sport-source-health.json'
      - '.github/workflows/watch-sport-video-sources.yml'
      - 'vercel.json'
      - '.github/workflows/verify-sport-media.yml'
  push:
    branches: [main]
    paths:
      - 'src/sport/**'
      - 'server/sport-live.js'
      - 'api/catalog.js'
      - 'tests/sport*.test.js'
      - 'vercel.json'
      - '.github/workflows/verify-sport-media.yml'

permissions:
  contents: read

concurrency:
  group: verify-sport-media-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sport-media:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Sport H24 and Finals regression tests
        run: node --test tests/sport-media.test.js tests/sport-source-health.test.js tests/sport.test.js
      - name: Production build
        run: npm run build
