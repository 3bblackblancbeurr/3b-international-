name: Verify PWA QuickKit

on:
  pull_request:
    paths:
      - 'api/pwa-*.js'
      - 'server/pwa-*.js'
      - 'public/pwa-quickkit/**'
      - 'public/outils-ia/**'
      - 'tests/pwa*.test.js'
      - 'supabase/migrations/*pwa_quickkit*.sql'
      - '.env.example'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-pwa-quickkit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test PWA QuickKit
        run: node --test tests/pwa*.test.js
      - name: Build application
        run: npm run build
