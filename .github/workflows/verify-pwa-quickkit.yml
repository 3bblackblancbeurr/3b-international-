name: Verify PWA QuickKit

on:
  pull_request:
    paths:
      - 'api/pwa-*.js'
      - 'server/pwa-*.js'
      - 'server/revenue-funnel.js'
      - 'api/revenue-event.js'
      - 'public/revenue-tracker.js'
      - 'public/pwa-quickkit/**'
      - 'public/pwa-tools/**'
      - 'public/outils-ia/**'
      - 'tests/pwa*.test.js'
      - 'supabase/migrations/*pwa_quickkit*.sql'
      - '.env.example'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-pwa-quickkit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test PWA QuickKit and funnel
        run: node --test tests/pwa*.test.js tests/revenue-funnel.test.js
      - name: Syntax-check browser scripts
        run: node --check public/pwa-quickkit/app.js && node --check public/revenue-tracker.js
      - name: Build application
        run: npm run build
