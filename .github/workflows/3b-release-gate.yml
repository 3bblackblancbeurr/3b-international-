name: 3B Release Gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Critical Passport and session tests
        run: node --test tests/passport-identity.test.js tests/passport-access-gate.test.js tests/passport-credential.test.js tests/passport-scopes.test.js tests/passport-verification.test.js tests/passport-passkeys.test.js tests/member-session-state.test.js tests/realm-gold-master.test.js tests/passport-games-integration.test.js tests/passport-ecosystem-integration.test.js tests/passport-relying-party.test.js tests/passport-account-security.test.js
      - name: Production build
        run: npm run build
      - name: Bundle budgets
        run: node scripts/verify-bundle-budget.mjs
      - name: Applied migration integrity
        run: node scripts/verify-applied-migration-integrity.mjs
