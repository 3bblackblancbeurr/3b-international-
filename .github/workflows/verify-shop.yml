name: Verify shop

on:
  pull_request:
    paths:
      - 'api/**'
      - 'server/shop*.js'
      - 'src/shop/**'
      - 'public/shop/**'
      - 'public/shipping.html'
      - 'tests/shop*.test.js'
      - '.env.example'
      - 'package*.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-shop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build application
        run: npm run build
      - name: Test checkout security and Stripe boundaries
        run: npm run test:shop
      - name: Test seller, customer and notification workflow
        run: node --test tests/shop-order-workflow.test.js tests/shop-notifications.test.js
