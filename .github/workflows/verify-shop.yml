name: Verify shop

on:
  pull_request:
    paths:
      - 'api/**'
      - 'server/shop*.js'
      - 'src/shop/**'
      - 'public/shop/**'
      - 'public/shipping.html'
      - 'tests/shop*.test.js'
      - '.env.example'
      - 'package*.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-shop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build application
        run: npm run build
      - name: Test seller, customer and notification workflow
        run: node --test tests/shop-order-workflow.test.js tests/shop-notifications.test.js
