name: Verify 3B Economy Hardening

on:
  pull_request:
    paths:
      - 'src/world/global-rewards.js'
      - 'src/loyalty/**'
      - 'supabase/functions/member-hub/**'
      - 'supabase/functions/world-engine/**'
      - 'supabase/migrations/**'
      - 'tests/economy-hardening.test.js'
      - '.github/workflows/verify-economy-hardening.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  economy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Economy authority tests
        run: node --test tests/economy-hardening.test.js
      - name: Production build
        run: npm run build
