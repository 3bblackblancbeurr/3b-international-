name: Verify world and application
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: verify-world-${{ github.ref }}
  cancel-in-progress: true
jobs:
  game-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Check complete world deployment package
        run: npm exec --yes --package=deno@2.9.6 -- deno check --no-lock --config supabase/functions/world-engine-goldmaster-candidate/deno.json supabase/functions/world-engine-goldmaster-candidate/index.ts
      - name: Check City endpoint
        run: npm exec --yes --package=deno@2.9.6 -- deno check --no-lock supabase/functions/city-3b/index.ts
