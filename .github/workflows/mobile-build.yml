name: Build mobile test versions

on:
  pull_request:
    paths:
      - 'android/**'
      - 'ios/**'
      - 'src/**'
      - 'public/**'
      - 'package*.json'
      - 'capacitor.config.json'
      - 'scripts/verify-android-play-readiness.mjs'
      - 'tests/companion-ios*'
      - '.github/workflows/mobile-build.yml'
      - '.github/workflows/android-play-release.yml'
  push:
    branches: [main, codex/3b-store-preparation-20260912]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run build
      - run: npx --no-install cap sync android
      - name: Verify Android API 36 / Play metadata
        run: node scripts/verify-android-play-readiness.mjs
      - name: Build Android test APK and unsigned bundle
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon --max-workers=2 testDebugUnitTest assembleDebug bundleRelease > "$RUNNER_TEMP/gradle-build.log" 2>&1; then
              cat "$RUNNER_TEMP/gradle-build.log"
              exit 0
            fi
            if ! grep -Eq "Received status code 429|Too Many Requests" "$RUNNER_TEMP/gradle-build.log"; then
              cat "$RUNNER_TEMP/gradle-build.log"
              exit 1
            fi
            echo "::warning::Maven returned HTTP 429; Gradle attempt $attempt/3 failed."
            tail -n 35 "$RUNNER_TEMP/gradle-build.log"
            if [ "$attempt" = "3" ]; then
              cat "$RUNNER_TEMP/gradle-build.log"
              exit 1
            fi
            sleep $((30 * attempt))
          done
      - name: Generate Android SHA-256 checksums
        shell: bash
        run: |
          find android/app/build/outputs/apk/debug android/app/build/outputs/bundle/release -type f \( -name '*.apk' -o -name '*.aab' \) -print0 | sort -z | xargs -0 sha256sum > artifacts/mobile/android-sha256.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: 3b-android-test-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
            artifacts/mobile/play-readiness.json
            artifacts/mobile/android-sha256.txt
          if-no-files-found: error
          retention-days: 14

  ios-simulator:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - name: Test Companion shared Swift model
        run: |
          swiftc --version
          node --test tests/companion-ios.test.js
      - run: npm ci
      - run: npm run build
      - run: npx --no-install cap sync ios
      - run: node scripts/pin-mobile-dependencies.mjs
      - name: Build iOS simulator app without signing
        run: >-
          xcodebuild -project ios/App/App.xcodeproj -scheme App
          -configuration Debug -destination 'generic/platform=iOS Simulator'
          -derivedDataPath artifacts/mobile/ios CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: 3b-ios-simulator-${{ github.sha }}
          path: artifacts/mobile/ios/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
          retention-days: 14
