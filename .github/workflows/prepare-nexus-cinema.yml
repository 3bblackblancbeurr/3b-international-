name: Materialize and verify Nexus cinema
on:
  push:
    branches: [chatgpt-improvements-nexus-cinema-20260913]
    paths: ['.github/workflows/prepare-nexus-cinema.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: prepare-nexus-cinema
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == '3bblackblancbeurr/3b-international-' && github.ref == 'refs/heads/chatgpt-improvements-nexus-cinema-20260913'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-improvements-nexus-cinema-20260913
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Import the exact approved reference and apply guarded UI changes
        env:
          NEXUS_ART_URL: 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/7be06508-f2f9-4c20-a973-a9539874ae6d.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiOTA5ODJjYjNiZWY1MWI1MSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc4OTM4MzIxOX0.gLl8pD5spFWwqhf8Gke2lIAeJH8ipacv2sJCMgnrN8w'
        run: python scripts/materialize-nexus-cinema.py "$NEXUS_ART_URL"
      - name: Commit local optimized artwork and guarded integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/nexus/cinema-v1 src/components/PassportNexus.jsx
          if ! git diff --cached --quiet; then
            git commit -m 'Integrate approved Nexus artwork as local cinematic assets and live UI'
            git push origin HEAD:chatgpt-improvements-nexus-cinema-20260913
          fi
          git rev-parse HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/verify-nexus.mjs
      - run: node scripts/verify-nexus-cinema.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nexus-cinema-integration-evidence
          path: |
            artifacts/nexus/
            artifacts/nexus-cinema/
          retention-days: 7
