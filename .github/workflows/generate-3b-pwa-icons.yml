name: Generate verified 3B PWA icons v2

on:
  push:
    branches:
      - fix/3b-pwa-maskable-icon-v4
    paths:
      - .github/workflows/generate-3b-pwa-icons.yml

permissions:
  contents: write

jobs:
  generate-icons:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Rebuild source and generate verified PNG icons
        run: |
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          from pathlib import Path

          from PIL import Image, ImageStat

          expected_length = 61772
          expected_sha256 = "e58df9a4ae373efddfe449835f42c01fb0bc5190b5c817fd7320a7f4a38d08af"

          source_parts = sorted(Path(".icon-source").glob("source-*.txt"))
          if len(source_parts) != 6:
              raise RuntimeError(f"Expected 6 source chunks, found {len(source_parts)}")

          encoded = "".join(part.read_text(encoding="utf-8").strip() for part in source_parts)
          if len(encoded) != expected_length:
              raise RuntimeError(f"Unexpected Base64 length: {len(encoded)}")

          source_bytes = base64.b64decode(encoded, validate=True)
          actual_sha256 = hashlib.sha256(source_bytes).hexdigest()
          if actual_sha256 != expected_sha256:
              raise RuntimeError(f"Source checksum mismatch: {actual_sha256}")
          if not source_bytes.startswith(b"\xff\xd8\xff") or not source_bytes.endswith(b"\xff\xd9"):
              raise RuntimeError("The reconstructed source is not a complete JPEG")

          temporary_source = Path(".icon-source/verified-3b-source.jpg")
          temporary_source.write_bytes(source_bytes)

          with Image.open(temporary_source) as opened:
              opened.load()
              if opened.size != (512, 512):
                  raise RuntimeError(f"Unexpected source dimensions: {opened.size}")
              source = opened.convert("RGB")

          source_stddev = sum(ImageStat.Stat(source).stddev) / 3
          if source_stddev < 20:
              raise RuntimeError(f"Source image has insufficient visual detail: {source_stddev:.2f}")

          icon_dir = Path("public/icons")
          icon_dir.mkdir(parents=True, exist_ok=True)

          def save_standard(size: int, filename: str) -> None:
              image = source.resize((size, size), Image.Resampling.LANCZOS)
              image.save(icon_dir / filename, format="PNG", optimize=True, compress_level=9)

          def save_maskable(size: int, filename: str) -> None:
              canvas = Image.new("RGB", (size, size), "#000000")
              inner_size = round(size * 0.82)
              image = source.resize((inner_size, inner_size), Image.Resampling.LANCZOS)
              offset = ((size - inner_size) // 2, (size - inner_size) // 2)
              canvas.paste(image, offset)
              canvas.save(icon_dir / filename, format="PNG", optimize=True, compress_level=9)

          specifications = [
              (180, "3b-app-20260912-180.png", False),
              (192, "3b-app-20260912-192.png", False),
              (512, "3b-app-20260912-512.png", False),
              (192, "3b-app-20260912-maskable-192.png", True),
              (512, "3b-app-20260912-maskable-512.png", True),
          ]

          for size, filename, maskable in specifications:
              if maskable:
                  save_maskable(size, filename)
              else:
                  save_standard(size, filename)

          for size, filename, _ in specifications:
              output = icon_dir / filename
              data = output.read_bytes()
              if not data.startswith(b"\x89PNG\r\n\x1a\n"):
                  raise RuntimeError(f"{output} is not a real PNG")
              if len(data) < 10_000:
                  raise RuntimeError(f"{output} is unexpectedly small: {len(data)} bytes")
              with Image.open(output) as verified:
                  verified.load()
                  if verified.size != (size, size):
                      raise RuntimeError(f"Unexpected dimensions for {output}: {verified.size}")
                  detail = sum(ImageStat.Stat(verified.convert("RGB")).stddev) / 3
                  if detail < 15:
                      raise RuntimeError(f"{output} lacks visual detail: {detail:.2f}")
              print(f"Verified {output}: {len(data)} bytes, {size}x{size}")
          PY

      - name: Commit verified icon files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/icons/3b-app-20260912-180.png \
                  public/icons/3b-app-20260912-192.png \
                  public/icons/3b-app-20260912-512.png \
                  public/icons/3b-app-20260912-maskable-192.png \
                  public/icons/3b-app-20260912-maskable-512.png
          if git diff --cached --quiet; then
            echo "Verified icons are already up to date."
            exit 0
          fi
          git commit -m "Add verified PNG and maskable 3B icons [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
