name: Verify Edge Source Parity

on:
  pull_request:
    paths:
      - 'supabase/functions/**'
      - 'tests/edge-deployment-source-parity.test.js'
      - '.github/workflows/verify-edge-source-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --test tests/edge-deployment-source-parity.test.js
