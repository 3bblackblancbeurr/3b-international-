name: World candidate dependencies
on:
  push:
    branches: [chatgpt-improvements-world-consolidation-20260920]
    paths: [.github/workflows/world-candidate-dependencies.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: tar -czf /tmp/world-dependencies.tar.gz node_modules
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: world-locked-dependencies
          path: /tmp/world-dependencies.tar.gz
          retention-days: 1
