name: Verify Edge Boundary Split

on:
  pull_request:
    paths:
      - 'src/loyalty/client.js'
      - 'src/lib/ecosystem.js'
      - 'src/ai/AiPage.jsx'
      - 'src/sport/SportPage.jsx'
      - 'supabase/functions/member-auth/**'
      - 'supabase/functions/member-api/**'
      - 'supabase/functions/ecosystem-public/**'
      - 'supabase/functions/ecosystem-private/**'
      - 'tests/edge-boundary-split.test.js'
      - '.github/workflows/verify-edge-boundary-split.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --test tests/edge-boundary-split.test.js
      - run: npm run build
