name: Verify Applied Migration Integrity

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      - 'scripts/verify-applied-migration-integrity.mjs'
      - 'scripts/verify-supabase-security.mjs'
      - 'tests/supabase-migration-integrity.test.js'
      - 'tests/supabase-security.test.js'
      - '.github/workflows/verify-migration-integrity.yml'
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'scripts/verify-applied-migration-integrity.mjs'
      - 'scripts/verify-supabase-security.mjs'
      - 'tests/supabase-migration-integrity.test.js'
      - 'tests/supabase-security.test.js'
      - '.github/workflows/verify-migration-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Verify immutable migration manifests
        run: node scripts/verify-applied-migration-integrity.mjs
      - name: Verify RLS and privileged SQL boundaries
        run: node scripts/verify-supabase-security.mjs
      - name: Verify migration and security contracts
        run: node --test tests/supabase-migration-integrity.test.js tests/supabase-security.test.js
