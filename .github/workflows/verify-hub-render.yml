name: Verify playable Hub renderer
on:
  pull_request:
    paths:
      - 'src/world/**'
      - 'scripts/verify-world-art-browser.mjs'
      - 'scripts/verify-hub-services-browser.mjs'
      - 'scripts/verify-hub-master-browser.mjs'
      - 'scripts/verify-world-gameplay-browser.mjs'
      - 'scripts/verify-world-master-combat-browser.mjs'
      - 'scripts/verify-realm-journey-browser.mjs'
      - 'scripts/verify-eight-realms-browser.mjs'
      - 'scripts/verify-route-planner-browser.mjs'
      - '.github/workflows/verify-hub-render.yml'
permissions:
  contents: read
concurrency:
  group: hub-render-${{ github.ref }}
  cancel-in-progress: true
jobs:
  master-combat:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx --no-install playwright install --with-deps chromium
      - name: Check real guardian windup, release, defense and camera on desktop and portrait
        run: node scripts/verify-world-master-combat-browser.mjs
        env:
          MASTER_COMBAT_OUT: ${{ runner.temp }}/world-master-combat
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: world-master-combat
          path: ${{ runner.temp }}/world-master-combat
          if-no-files-found: warn
  interface:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install isolated browser test dependency
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx --no-install playwright install --with-deps chromium
      - name: Check six civic services on desktop and both phone orientations
        run: node scripts/verify-hub-services-browser.mjs
        env:
          HUB_SERVICES_OUT: artifacts/hub-interface/services
      - name: Check real Hub interface, guidance and save recovery
        run: node scripts/verify-hub-master-browser.mjs
        env:
          HUB_MASTER_OUT: artifacts/hub-interface/master-ui
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: playable-hub-interface
          path: artifacts/hub-interface
          if-no-files-found: warn
  realm-gameplay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [gestures, journey, routes, audio]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx --no-install playwright install --with-deps chromium
      - name: Check audio, gestures, movement and dismissible HUD
        if: matrix.suite == 'gestures'
        run: node scripts/verify-world-gameplay-browser.mjs
        env:
          GAMEPLAY_OUT: artifacts/realm-gameplay/gestures
      - name: Check realm travel, choices, journal and atlas on desktop and touch
        if: matrix.suite == 'journey'
        run: node scripts/verify-realm-journey-browser.mjs
        env:
          REALM_UI_OUT: artifacts/realm-gameplay/journey
      - name: Check background route parity and cancellation in a native worker
        if: matrix.suite == 'routes'
        run: node scripts/verify-route-planner-browser.mjs
        env:
          ROUTE_PLANNER_OUT: artifacts/realm-gameplay/routes
      - name: Check real WebAudio touch unlock, silence and resume
        if: matrix.suite == 'audio'
        run: node scripts/verify-world-audio-browser.mjs
        env:
          AUDIO_OUT: artifacts/realm-gameplay/audio
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: playable-realm-gameplay-${{ matrix.suite }}
          path: artifacts/realm-gameplay/${{ matrix.suite }}
          if-no-files-found: warn
  eight-realms:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: western
            regions: france,espagne
          - group: mediterranean
            regions: italie,tunisie
          - group: maghreb
            regions: algerie,maroc
          - group: north-east
            regions: turquie,estonie
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx --no-install playwright install --with-deps chromium
      - name: Traverse outer provinces and villages of both realms, including guardian courts
        run: node scripts/verify-eight-realms-browser.mjs
        env:
          EIGHT_REALMS_REGIONS: ${{ matrix.regions }}
          EIGHT_REALMS_OUT: artifacts/eight-realms/${{ matrix.group }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: eight-realms-terrain-${{ matrix.group }}
          path: artifacts/eight-realms/${{ matrix.group }}
          if-no-files-found: warn
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - view: desktop
            width: 1280
            height: 720
            quality: detail
            clock: '16:20:00'
          - view: phone
            width: 390
            height: 844
            quality: fluid
            clock: '16:20:00'
          - view: desktop-night
            width: 1280
            height: 720
            quality: detail
            clock: '22:00:00'
          - view: phone-night
            width: 390
            height: 844
            quality: fluid
            clock: '22:00:00'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install isolated browser test dependency
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx --no-install playwright install --with-deps chromium
      - name: Render actual Hub and check movement and shader errors
        run: node scripts/verify-world-art-browser.mjs
        env:
          WORLD_ART_REGIONS: hub
          # The armory fixture ignores the world clock. Test each distinct
          # viewport once; all four rows still render and exercise the Hub.
          WORLD_ART_ARMORY: ${{ (matrix.view == 'desktop' || matrix.view == 'phone') && '1' || '0' }}
          WORLD_ART_WIDTH: ${{ matrix.width }}
          WORLD_ART_HEIGHT: ${{ matrix.height }}
          WORLD_ART_QUALITY: ${{ matrix.quality }}
          WORLD_ART_CLOCK: ${{ matrix.clock }}
          WORLD_ART_OUT: artifacts/hub-${{ matrix.view }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: playable-hub-${{ matrix.view }}
          path: artifacts/hub-${{ matrix.view }}
          if-no-files-found: warn
