name: 3B Fortress Security

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fortress-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Security boundary tests
        run: npm test

      - name: Full Git history secret-pattern scan
        run: node scripts/security-scan-history.mjs

      - name: Production build
        run: npm run build

      - name: High/critical production dependency audit
        run: npm audit --omit=dev --audit-level=high
